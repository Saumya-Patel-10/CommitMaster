services:
  - type: web
    name: commitmaster-server
    env: python
    buildCommand: pip install -r requirements-server.txt
    startCommand: gunicorn server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Administrator identity is NEVER stored in source control.
      # Enter these values privately in the Render dashboard.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_MIGRATION_SECRET
        sync: false
